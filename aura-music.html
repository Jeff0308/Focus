    <script>// 在畫面繪製前先套用主題，避免淺色使用者開啟時閃一下深色。
// 設定格式與 SettingsRepository 相同（localStorage: aura-music:settings:v1）。
(function () {
  var pref = 'dark'; // 與 SettingsRepository 的預設值一致，否則第一次開啟時淺色系統會先閃一下淺色
  try {
    var raw = localStorage.getItem('aura-music:settings:v1');
    if (raw) {
      var t = JSON.parse(raw).theme;
      if (t === 'dark' || t === 'light' || t === 'system') pref = t;
    }
  } catch (e) {
    /* 讀不到就用預設 */
  }
  var theme = pref;
  if (pref === 'system') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  var root = document.documentElement;
  root.setAttribute('data-theme', theme);
  root.style.colorScheme = theme;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0e11' : '#f6f3ee');
})();</script>
